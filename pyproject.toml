[project]
name = "annuaire-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rayan Hamimi", email = "rhamimi.493@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.6",
    "polars>=2.0.0",
    "psutil>=7.2.2",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "requests>=2.34.2",
]

[project.scripts]
annuaire-project = "annuaire_project:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "psutil>=7.2.2",
    "ruff>=0.16.8",
    "types-psutil>=7.2.2.20260906",
]

[[tool.mypy.overrides]]
module = ["pandas.*"]
ignore_missing_imports = true
