[project]
name = "annuaire-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rayan Hamimi", email = "rhamimi.493@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "folium>=0.20.0",
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "polars>=2.0.0",
    "psutil>=7.2.2",
    "psycopg[binary]>=3.3.8",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.8",
    "streamlit>=1.67.0",
    "streamlit-folium>=0.27.4",
]

[project.scripts]
annuaire-project = "annuaire_project:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "mypy>=2.3.1",
    "psutil>=7.2.2",
    "ruff>=0.16.8",
    "types-psutil>=7.2.2.20260906",
]

[[tool.mypy.overrides]]
module = ["pandas.*"]
ignore_missing_imports = true
