[project]
name = "annuaire-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rayan Hamimi", email = "rhamimi.493@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.6",
    "requests>=2.34.2",
]

[project.scripts]
annuaire-project = "annuaire_project:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.8",
]

[[tool.mypy.overrides]]
module = ["pandas.*"]
ignore_missing_imports = true